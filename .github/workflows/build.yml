name: build

on:
  push:
    branches: [main, next]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo test --locked
      - run: cargo build --release --locked

      # Downloadable from the Actions run page (sign-in required, kept 90 days).
      - uses: actions/upload-artifact@v7
        with:
          name: termhop-windows-x64
          path: target/release/termhop.exe

  # termhop-next (next/): russh + libghostty-vt + GPUI. Alpha.
  next:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: next
    steps:
      - uses: actions/checkout@v7
      # libghostty-vt is built from source with Zig.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: next
      - run: cargo test --locked
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v7
        with:
          name: termhop-next-windows-x64
          path: next/target/release/termhop-next.exe

  # Push to the next branch: replace the "next-alpha" prerelease with this build.
  next-release:
    needs: next
    if: github.event_name == 'push' && github.ref == 'refs/heads/next'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: termhop-next-windows-x64
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete next-alpha --cleanup-tag --yes || true
          gh release create next-alpha termhop-next.exe --prerelease --target "$GITHUB_SHA" \
            --title "termhop-next alpha (${GITHUB_SHA::7})" \
            --notes "next 브랜치 시험판입니다. 사용법과 확인할 것은 next 브랜치 README를 보세요."

  # Tag push (v*): publish a GitHub Release with the exe attached.
  release:
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches Cargo.toml version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          name: termhop-windows-x64
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f="termhop-${GITHUB_REF_NAME}-windows-x64.exe"
          mv termhop.exe "$f"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$f" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$f" --title "termhop $GITHUB_REF_NAME" --generate-notes
          fi
